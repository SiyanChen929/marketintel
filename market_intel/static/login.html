<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fcfcfb"><meta name="apple-mobile-web-app-capable" content="yes"><title>Market Intel · sign in</title>
<link rel="stylesheet" href="/static/base.css">
<style>body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 26px;width:min(100%,380px)}.box h1{font-size:18px;margin-bottom:4px}.box p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.box input{width:100%;padding:9px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:10px;min-height:44px}.err{color:var(--crit);font-size:12.5px;margin-bottom:8px}</style></head>
<body><main><form class="box" method="post" action="/login" aria-labelledby="login-title"><h1 id="login-title">Market Intel</h1><p>AI &amp; semiconductor value chain · private research dashboard</p>
__ERROR__<label for="pw" class="sr-only">Access token</label><input type="password" id="pw" name="password" placeholder="access token" autofocus autocomplete="current-password" aria-describedby="login-help"><input type="hidden" name="next" value="__NEXT__">
<button class="primary" type="submit" style="width:100%">Sign in</button><p id="login-help" style="margin-top:12px">Token: <code>python -m market_intel token</code> on the host.</p></form></main></body></html>
